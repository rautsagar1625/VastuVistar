# Netlify configuration for Vastu Vistar LLP (Create React App + CRACO)

[build]
  base      = "frontend"
  command   = "npm run build"
  publish   = "build"
  # Functions live at the repo root, outside the frontend base directory.
  functions = "../netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # CRA treats warnings as errors on CI otherwise, which breaks the build.
  CI = "false"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Clean URL for the enquiry function. Must come before the SPA fallback —
# redirects are matched in order, and the catch-all would swallow it.
[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/enquiry"
  status = 200

# SPA fallback: react-router handles all client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "geolocation=(), microphone=(), camera=()"
